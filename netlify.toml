# Netlify detects Next.js and runs it with its Next.js runtime (pages, API routes, server actions, middleware).
# The database is external (e.g. Aiven MySQL); set DB_*, DB_SSL=true, AUTH_SECRET and SITE_URL in
# Site configuration -> Environment variables. Run `npm run db:migrate` against that database before first use.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
